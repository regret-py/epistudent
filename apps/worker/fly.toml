# fly launch --no-deploy --config apps/worker/fly.toml ; fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
app = "studybuddy-worker"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the scheduler must keep running
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
