name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Dummy values: the build only needs them to exist.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright + local Supabase)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations + seed)
        run: |
          cat > supabase/.env <<'ENV'
          SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID=ci-placeholder
          SUPABASE_AUTH_EXTERNAL_AZURE_SECRET=ci-placeholder
          SUPABASE_AUTH_EXTERNAL_AZURE_URL=https://login.microsoftonline.com/common
          ENV
          pnpm exec supabase start -x vector,logflare,edge-runtime,imgproxy,supavisor,storage-api,studio,postgres-meta,mailpit
          pnpm exec supabase status -o env > /tmp/sb.env
          source /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Schema types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts

      - run: pnpm --filter @studybuddy/web build   # static export → apps/web/out
      - run: pnpm --filter @studybuddy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
