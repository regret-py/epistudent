name: CI

# Pull requests and work branches. Pushes to the deploy branches are checked by deploy.yml,
# which runs the same checks and only publishes if they pass.
on:
  pull_request:
  push:
    branches-ignore: [main, claude/studybuddy-epitech-build-1hgay1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, unit tests, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @studybuddy/web build # static export + CSP → apps/web/out
      - run: pnpm --filter @studybuddy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
